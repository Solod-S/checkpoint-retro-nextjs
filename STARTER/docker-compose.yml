services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkpoint_retro
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    ports:
      - "5432:5432"
    volumes:
      - checkpoint_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint_retro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  checkpoint_postgres:
